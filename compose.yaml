name: sanlam-ihub

services:
  sanlamihubassessment:
    image: sanlamihubassessment
    build:
      context: .
      dockerfile: src/SanlamIHubAssessment/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=sanlam_ihub;Username=postgres;Password=postgres"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sanlam_ihub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sanlam_ihub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
